version: '3.8'

services:
  # 1. MariaDB Database Service
  mariadb:
    image: mariadb:10.11
    container_name: chat_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: chat_app_db
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: chatpassword
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Node.js + Socket.io Server
  server:
    build: .
    container_name: chat_server
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: mariadb
      DB_USER: chatuser
      DB_PASSWORD: chatpassword
      DB_NAME: chat_app_db
      DB_PORT: 3306
      JWT_SECRET: super_secret_jwt_key_talknex_2026
    depends_on:
      - mariadb

volumes:
  mariadb_data:
